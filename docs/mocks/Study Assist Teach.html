document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 'Topic \\u00D7 student heatmap' },\n    ];\n    findings[1].onClick = () => this.setState({ drawer: 'niasingh05' });\n    findings.forEach(f => { if (!f.onClick) f.onClick = () => this.showToast('Opening ' + f.link + '\\u2026'); });\n\n    const chartMax = Math.max(healthyCount, midWatch.length, nHigh, nCrit, 1);\n    const bars = [\n      { key: 'healthy', label: 'Healthy', glyph: '\\u25AC', count: healthyCount, color: '#067647', bg: '#17b26a' },\n      { key: 'watch', label: 'Watch', glyph: '\\u25CF', count: midWatch.length, color: '#a16207', bg: 'repeating-linear-gradient(45deg,#eab308 0,#eab308 4px,#f5d661 4px,#f5d661 8px)' },\n      { key: 'high', label: 'High', glyph: '\\u25C6', count: nHigh, color: '#c4320a', bg: 'repeating-linear-gradient(-45deg,#f97316 0,#f97316 5px,#fca55d 5px,#fca55d 10px)' },\n      { key: 'critical', label: 'Critical', glyph: '\\u25B2', count: nCrit, color: '#b42318', bg: '#d92d20' },\n    ].map(b => {\n      const activeBar = (st.riskTier === 'attention' && (b.key === 'high' || b.key === 'critical')) || st.riskTier === b.key;\n      const map = { healthy: null, watch: 'watch', high: 'attention', critical: 'attention' };\n      return { ...b, h: Math.round(14 + (b.count / chartMax) * 140) + 'px', ring: activeBar ? '2px solid #0f1729' : '2px solid transparent', onClick: () => { const v = map[b.key]; this.setState(s => ({ riskTier: s.riskTier === v ? null : v })); } };\n    });\n\n    const tierAxis = [\n      { key: null, label: 'All', count: midAtt.length + midWatch.length },\n      { key: 'attention', label: 'Attention', count: midAtt.length },\n      { key: 'watch', label: 'Watch', count: midWatch.length },\n    ].map(t => ({ ...t, style: this.wlTabStyle(st.riskTier === t.key), onClick: () => this.setState({ riskTier: t.key }) }));\n    const reasonAxis = ['no-engagement', 'low-pass', 'low-quiz', 'stuck'].map(k => {\n      const act = st.riskReason === k;\n      return { key: k, label: this.reasonMeta[k], count: midActive.filter(s => olor: pub ? '#a16207' : '#067647',\n        onPrimary: () => this.showToast((pub ? 'Unpublished ' : 'Approved ') + t.name),\n        onDelete: () => this.showToast('Delete guarded \\u2014 confirm to remove \\u201C' + t.name + '\\u201D'),\n        onEdit: () => this.showToast('Opening editor for \\u201C' + t.name + '\\u201D\\u2026'),\n        milestones: ['Define the key ideas of this topic', 'Work through a guided code example', 'Pass the milestone mastery check'],\n        quizLine: '5 questions \\u00B7 Remember \\u00B7 30 / 50 / 20 easy\\u00B7med\\u00B7hard',\n      };\n    });\n    const deskPublished = deskTopics.filter(t => t.status === 'published');\n    const deskDrafts = deskTopics.filter(t => t.status === 'draft');\n    const deskChat = [\n      { role: 'you', text: 'Structure the course around the primary syllabus \\u2014 about 1\\u20132 weeks per topic, following the classic CS1 progression.' },\n      { role: 'ai', text: 'Created 15 topics from your syllabus, one per unit \\u2014 Introduction to Computer Science (Unit 1) through Final Week Review (Unit 15). Seven are published; eight remain drafts for your review.' },\n    ].map(m => ({ ...m, label: m.role === 'you' ? 'You' : 'Assistant', labelColor: m.role === 'you' ? '#2563eb' : '#6b7385',\n      wrap: m.role === 'you' ? \"align-self:flex-end; background:#eef4ff; border:1px solid #d3e0ff; border-radius:12px 12px 4px 12px;\" : \"align-self:flex-start; background:#f6f7f9; border:1px solid #e8eaee; border-radius:12px 12px 12px 4px;\" }));\n\n    // ===== STUDENTS =====\n    const stuAttn = active.filter(s => s.tier === 'critical' || s.tier === 'high').length;\n    const stuWatchN = active.filter(s => s.tier === 'watch').length;\n    const stuHealthyN = active.filter(s => s.tier === 'healthy').length;\n    const stuTabs = [\n      { key: null, label: 'All', count: active.length },\n      { key: 'attention', label: 'Attention', count: stuAttn },\n      { key: 'watch', label: 'Watch', count: stuWatchN },\n      { key: 'healthy', label: 'Healthy', count: stuHealthyN },\n    ].map(t => ({ ...t, style: this.wlTabStyle(st.stuTier === t.key), onClick: () => this.setState({ stuTier: t.key }) }));\n    let stuList = active.slice();\n    if (st.stuTier === 'attention') stuList = stuList.filter(s => s.tier === 'critical' || s.tier === 'high');\n    else if (st.stuTier) stuList = stuList.filter(s => s.tier === st.stuTier);\n    const sq = st.stuQuery.trim().toLowerCase();\n    if (sq) stuList = stuList.filter(s => s.name.toLowerCase().includes(sq) || s.handle.toLowerCase().includes(sq));\n    stuList = stuList.sort((a, b) => this.tierMeta[a.tier].rank - this.tierMeta[b.tier].rank || b.score - a.score);\n    const studentsList = stuList.map(s => {\n      const t = this.tierMeta[s.tier];\n      const b = this.basics(s);\n      const id = 'stu_' + s.handle;\n      const expanded = !!st.expanded[id];\n      const tpassColor = b.tpass >= 85 ? '#067647' : b.tpass >= 60 ? '#a16207' : '#b42318';\n      const tpassBg = b.tpass >= 85 ? '#ecfdf3' : b.tpass >= 60 ? '#fefce8' : '#fef3f2';\n      const tpassBorder = b.tpass >= 85 ? '#b8ecca' : b.tpass >= 60 ? '#fde68a' : '#fecdca';\n      return {\n        name: s.name, handle: s.handle, courseShort: this.courseShort(s.course), initials: this.initials(s.name),\n        isRisk: s.tier !== 'healthy', tierLabel: t.label, glyph: t.glyph, color: t.color, tint: t.tint, border: t.border,\n        riskBadgeText: s.tier !== 'healthy' ? (t.glyph + ' ' + t.label) : 'On track',\n        riskBadgeStyle: s.tier !== 'healthy'\n          ? \"font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:\" + t.color + \"; background:\" + t.tint + \"; border:1px solid \" + t.border + \"; border-radius:6px; padding:4px 9px; white-space:nowrap;\"\n          : \"font-size:10px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:#8891a0; background:#f2f4f7; border:1px solid #e8eaee; border-radius:6px; padding:4px 9px; w onitorNoteTab === 'course'),\n      monNoteTopicStyle: this.wlTabStyle(st.monitorNoteTab === 'topic'),\n      onMonNoteCourse: () => this.setState({ monitorNoteTab: 'course' }),\n      onMonNoteTopic: () => this.setState({ monitorNoteTab: 'topic' }),\n      monNoteLabel: st.monitorNoteTab === 'course' ? 'Write a course-wide note about this student\\u2026' : 'Write a note about this topic session\\u2026',\n      onSaveMonitorNote: () => this.showToast('Note saved for this student'),\n      studentsSummary: stuAttn + ' need attention \\u00B7 ' + stuWatchN + ' watch \\u00B7 ' + stuHealthyN + ' healthy',\n      studentsCount: active.length,\n      stuTabs, studentsList,\n      stuQuery: st.stuQuery,\n      onStuQuery: (e) => this.setState({ stuQuery: e.target.value }),\n      studentsEmpty: studentsList.length === 0,\n      deskTitle: 'CPS 1231 \\u2014 Mid Semester',\n      deskCode: 'BDAC1D',\n      deskStatusLine: 'Active \\u00B7 7 of 15 topics published',\n      onCopyCode: () => this.showToast('Access code copied to clipboard'),\n      onViewInsightsBtn: () => this.setState({ view: 'report' }),\n      deskMenuOpen: st.openMenu === 'course',\n      toggleDeskMenu: (e) => { e.stopPropagation(); this.setState(s => ({ openMenu: s.openMenu === 'course' ? null : 'course' })); },\n      onDeleteCourse: () => this.showToast('Delete course \\u2014 opens a confirmation dialog'),\n      onDuplicateCourse: () => this.showToast('Course duplicated as a draft'),\n      onBackToDash: () => this.setState({ view: 'front' }),\n      deskKpis,\n      hotSignalText: 'Students are struggling with the Introduction to Computer Science milestone \\u2014 51.5% pass across 33 attempts so far.',\n      onOpenInsights: () => this.setState({ view: 'report' }),\n      instructions: st.instructions,\n      onInstructions: (e) => this.setState({ instructions: e.target.value }),\n      onSaveInstructions: () => this.showToast('Teaching instructions saved'),\n      deskPublished, deskDrafts, deskChat rder-radius:999px; background:\" + (st.synthetic ? '#2563eb' : '#cdd2db') + \"; display:inline-flex; align-items:center; padding:2px; transition:background .18s; cursor:pointer;\",\n      switchKnob: \"width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2); transform:translateX(\" + (st.synthetic ? '18px' : '0') + \"); transition:transform .18s;\",\n\n      briefRest, briefS2, briefS3,\n      openAssistant: () => this.setState({ assistantOpen: true }),\n      closeAssistant: () => this.setState({ assistantOpen: false }),\n      assistantOpen: st.assistantOpen,\n      assistantAnswer: '3 students need attention now: Nia Singh (Critical), Isabela Zhao and Mateo Alvarez (High). Nia is the most urgent \\u2014 20% quiz average, one attempt, no engagement in 7 days. The Watch tier (' + watch.length + ') is almost entirely disengagement rather than difficulty.',\n      assistantSuggestions,\n\n      needsAttentionCount: attention.length,\n      watchCountTotal: watch.length,\n      coursesCount: 2,\n      onFocusAttention: () => this.setState({ view: 'front', wlFilter: 'attention' }),\n      attentionMini: attention.slice(0, 3).map(s => ({ name: s.name, courseShort: this.courseShort(s.course), glyph: this.tierMeta[s.tier].glyph, color: this.tierMeta[s.tier].color, onOpen: () => this.setState({ drawer: s.handle }) })),\n      figures, wlTabs, watchGroups, courseCards,\n\n      paletteOpen: st.paletteOpen,\n      closePalette: () => this.setState({ paletteOpen: false }),\n      stop: (e) => e.stopPropagation(),\n      onQuery: (e) => this.setState({ query: e.target.value }),\n      query: st.query,\n      paletteResults: results,\n      noResults: q && results.length === 0,\n\n      drawerOpen: !!drawerStudent,\n      drawer: drawerStudent ? this.buildDrawer(drawerStudent) : {},\n      closeDrawer: () => this.setState({ drawer: null }),\n      onSaveNote: () => this.showToast('Note saved for this student.'),\n\n      toast: st.toast,
