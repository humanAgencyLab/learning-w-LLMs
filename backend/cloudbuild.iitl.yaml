# Cloud Build config for the IITL (Instructor-In-The-Loop) study deployment.
# Mirrors cloudbuild.yaml but deploys to a separate Cloud Run service so the
# professor study runs in isolation from production traffic.
#
# Usage:
#   gcloud builds submit --config backend/cloudbuild.iitl.yaml \
#     --project llm-ed-studyassist
#
# Notes:
#   - First deploy will fail to bind secrets if the IITL secrets don't exist
#     yet (mongodb-uri-iitl, cors-origins-iitl). Create them with
#     `gcloud secrets create` before submitting this build.
#   - Secret access for the Cloud Run runtime service account must be granted
#     once via `gcloud secrets add-iam-policy-binding` for each new secret.

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/studyassist-iitl-backend:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/studyassist-iitl-backend:latest'
      - '.'
    dir: 'backend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/studyassist-iitl-backend:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/studyassist-iitl-backend:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'studyassist-iitl-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/studyassist-iitl-backend:$BUILD_ID'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      # NOTE: intentionally NO --set-env-vars here. On image-only redeploys we
      # preserve the env vars already on the running service (NODE_ENV,
      # DEPLOY_ENV, INSTRUCTOR_SIGNUP_SECRET, and the RL_* rate-limit overrides).
      # --set-env-vars REPLACES the whole set, which would wipe those. Manage
      # plain env vars via `gcloud run services update --update-env-vars`.
      - '--set-secrets'
      - 'GROQ_API_KEY=groq-api-key:latest,MONGODB_URI=mongodb-uri-iitl:latest,JWT_SECRET=jwt-secret:latest,CORS_ORIGINS=cors-origins-iitl:latest'

images:
  - 'gcr.io/$PROJECT_ID/studyassist-iitl-backend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/studyassist-iitl-backend:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
