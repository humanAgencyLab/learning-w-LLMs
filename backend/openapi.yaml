openapi: 3.0.0
info:
  title: Study Assist API
  version: 1.0.0
  description: |
    API for the Study Assist learning platform - an LLM-powered educational chatbot 
    that helps users study and revise topics dynamically with structured learning paths, 
    quizzes, and gamification.
  contact:
    name: Study Assist Team
    email: support@studyassist.dev
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:5001
    description: Local development server
  - url: https://api.studyassist.dev
    description: Production server (future)

tags:
  - name: Health
    description: Health and readiness checks
  - name: Auth
    description: Authentication and user management (Phase 1)
  - name: Sessions
    description: Study session management (Phase 4)
  - name: Assessment
    description: Learning assessment and topic determination (Phase 2)
  - name: Chat
    description: Chat interface and message handling (Phase 2)
  - name: Quiz
    description: Quiz generation and submission (Phase 3)
  - name: Analytics
    description: Performance tracking and research data (Phase 5)

paths:
  /v1/health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the basic health status of the API server
      operationId: getHealth
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Health status
                    example: true
                  time:
                    type: string
                    format: date-time
                    description: Current server time
                    example: "2024-01-15T10:30:00.000Z"
                required:
                  - ok
                  - time
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/ready:
    get:
      tags:
        - Health
      summary: Readiness check
      description: |
        Returns the readiness status of the API server including database connectivity.
        This endpoint checks if the server is ready to handle requests.
      operationId: getReady
      responses:
        '200':
          description: Server is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Readiness status
                    example: true
                  db:
                    type: string
                    description: Database connection status
                    enum: [connected, down]
                    example: "connected"
                  time:
                    type: string
                    format: date-time
                    description: Current server time
                    example: "2024-01-15T10:30:00.000Z"
                required:
                  - ok
                  - db
                  - time
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Readiness status
                    example: false
                  db:
                    type: string
                    description: Database connection status
                    enum: [connected, down]
                    example: "down"
                  time:
                    type: string
                    format: date-time
                    description: Current server time
                    example: "2024-01-15T10:30:00.000Z"
                  error:
                    type: string
                    description: Error message
                    example: "Database connection failed"
                required:
                  - ok
                  - db
                  - time

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: "Internal server error"
        code:
          type: string
          description: Error code
          example: "INTERNAL_ERROR"
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
          example: "2024-01-15T10:30:00.000Z"
        requestId:
          type: string
          description: Request ID for debugging
          example: "req_123456789"
      required:
        - error
        - timestamp

    # Placeholder schemas for future endpoints
    User:
      type: object
      description: User profile information (Phase 1)
      properties:
        id:
          type: string
          description: Unique user identifier
          example: "user_123456789"
        email:
          type: string
          format: email
          description: User email address
          example: "user@example.com"
        name:
          type: string
          description: User display name
          example: "John Doe"
        avatarUrl:
          type: string
          format: uri
          description: User avatar image URL
          example: "https://example.com/avatar.jpg"
        preferences:
          $ref: '#/components/schemas/UserPreferences'
        stats:
          $ref: '#/components/schemas/UserStats'
      required:
        - id
        - email
        - name

    UserPreferences:
      type: object
      description: User preferences and settings
      properties:
        defaultModel:
          type: string
          description: Default LLM model preference
          example: "llama3.1"
        explanationLength:
          type: string
          description: Preferred explanation detail level
          enum: [brief, concise-but-complete, detailed]
          example: "concise-but-complete"
        theme:
          type: string
          description: UI theme preference
          enum: [light, dark, auto]
          example: "dark"

    UserStats:
      type: object
      description: User learning statistics
      properties:
        pointsTotal:
          type: integer
          description: Total points earned
          example: 1250
        gemsTotal:
          type: integer
          description: Total gems earned
          example: 62
        trophiesTotal:
          type: integer
          description: Total trophies earned
          example: 3

    StudySession:
      type: object
      description: Study session information (Phase 3)
      properties:
        id:
          type: string
          description: Unique session identifier
          example: "session_123456789"
        userId:
          type: string
          description: User who owns this session
          example: "user_123456789"
        topic:
          type: string
          description: Learning topic
          example: "Machine Learning Fundamentals"
        chatTitle:
          type: string
          description: Session title
          example: "ML Basics - Neural Networks"
        learningStyle:
          type: string
          description: Learning approach
          enum: [studying, revision]
          example: "studying"
        modelUsed:
          type: string
          description: LLM model used
          example: "llama3.1"
        status:
          type: string
          description: Current session status
          enum: [pre, assessing, learning, quizzing, feedback, completed]
          example: "learning"
        plan:
          type: array
          description: Learning modules
          items:
            $ref: '#/components/schemas/LearningModule'
        progressPercent:
          type: number
          format: float
          description: Overall progress percentage
          minimum: 0
          maximum: 100
          example: 65.5
        points:
          type: integer
          description: Points earned in this session
          example: 45
        gems:
          type: integer
          description: Gems earned in this session
          example: 2
        hasTrophy:
          type: boolean
          description: Whether session has earned a trophy
          example: false
        isViewOnly:
          type: boolean
          description: Whether session is completed and view-only
          example: false
        createdAt:
          type: string
          format: date-time
          description: Session creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Session last update timestamp
      required:
        - id
        - userId
        - topic
        - learningStyle
        - status

    LearningModule:
      type: object
      description: Individual learning module within a session
      properties:
        id:
          type: string
          description: Module identifier
          example: "module_1"
        title:
          type: string
          description: Module title
          example: "Introduction to Neural Networks"
        status:
          type: string
          description: Module completion status
          enum: [pending, in_progress, completed]
          example: "in_progress"
        progress:
          type: number
          format: float
          description: Module progress percentage
          minimum: 0
          maximum: 100
          example: 75.0
        pointsAllocated:
          type: integer
          description: Points allocated to this module
          example: 25
      required:
        - id
        - title
        - status

  securitySchemes:
    # Placeholder for future authentication schemes
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication (Phase 1)

    CookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Session cookie authentication (Phase 1)

security:
  - BearerAuth: []
  - CookieAuth: []

# External documentation
externalDocs:
  description: Study Assist Documentation
  url: https://docs.studyassist.dev